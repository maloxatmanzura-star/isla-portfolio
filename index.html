<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isla Studio | Erkinova Malohat, aspiring software engineer</title>
    <meta name="description" content="Portfolio of Erkinova Malohat, an aspiring software engineer building thoughtful web experiences. Featured project: TinyToons, in progress." />
    <meta name="theme-color" content="#f5f1e7" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Isla Studio" />
    <meta property="og:title" content="Isla Studio | Erkinova Malohat" />
    <meta property="og:description" content="A digital garden of ideas and projects in progress, by an aspiring software engineer." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      /* Apply saved theme/language before first paint to avoid a flash. */
      try {
        var t = localStorage.getItem("isla-theme");
        if (t !== "day" && t !== "night") t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("isla-language");
        if (l === "en" || l === "uz") document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
